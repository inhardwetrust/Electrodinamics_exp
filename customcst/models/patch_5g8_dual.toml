# customcst project for patch_5g8_dual.step

[simulation]
f_min = 4.5   # GHz
f_max = 7.0   # GHz
padding = 0.0   # mm
trim_pulse = false
accuracy = "-40"   # dB
excite = "all"

[mesh]
cells_per_wavelength = 40.0
cells_per_feature = 8.0
max_ratio = 1.3
min_step = 0.0   # mm
slanted = true

[farfield]
frequencies = "5.6, 5.7, 5.8"   # GHz

[bodies.feed]
type = "port"
impedance = 50.0   # Ω

[bodies.ground]
type = "pec"

[bodies.substrate]
type = "dielectric"
material = "Custom"
eps_r = 4.3
tan_d = 0.02
f_ref = 5.8   # GHz
mu_r = 1.0

[bodies.top]
type = "pec"

[view]
up = "z"
edges = true
xray = false
ref_planes = true
mesh = false
materials = false
section = false
flip = false
plane = "z"
at = 0.8   # mm
hidden = []
camera_center = [0.0, 0.0, 0.8]   # mm
camera_distance = 85.5973   # mm
camera_rotation = [-0.33402, -0.153253, -0.930024, 0.066945, 0.980345, -0.185588, 0.940186, -0.124249, -0.317195]

[z0path]
axis = "z"
at = 0.0   # mm
half_width = 2.0   # mm
points = []   # mm

[materials.Default]
eps_r = 1.0
tan_d = 0.0
f_ref = 10.0   # GHz
mu_r = 1.0

[materials.FR4]
eps_r = 4.3
tan_d = 0.02
f_ref = 3.0   # GHz
mu_r = 1.0

[materials.PTFE]
eps_r = 2.1
tan_d = 0.0002
f_ref = 10.0   # GHz
mu_r = 1.0

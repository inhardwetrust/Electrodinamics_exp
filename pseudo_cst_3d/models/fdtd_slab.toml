name = "FDTD 2D TE - dipole + dielectric slab"
description = "Glass slab above the dipole: wavelength / 2 inside, partial reflection, bound charge on its surfaces."
solver = "fdtd2d"

[domain]
bounds = [[-5.71, -4.0], [5.71, 4.0]]
cells_per_wavelength = 20

[boundary]
kind = "pml"
cells = 12

[excitation]
frequency = 1.0
waveform = "sine"

[numerics]
courant = 0.5

[materials]
glass = { eps_r = 4.0 }

[[objects]]
type = "port"
name = "port 1"
a = [-0.25, 0.0]
b = [0.25, 0.0]

# Runs through the PML on purpose: CPML stretches coordinates, so it
# absorbs inside dielectrics too.
[[objects]]
type = "rect"
name = "slab"
material = "glass"
lo = [-50.0, 0.75]
hi = [50.0, 1.5]

[view]
height = 4.0
heatmap = "Hz"
steps_per_frame = 2

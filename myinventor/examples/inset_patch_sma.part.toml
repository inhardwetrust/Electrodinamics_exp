[[feature]]
name = "LegExt"
type = "extrude"
sketch = "LegSketch"
distance = "sma.gap - board.h"
operation = "join"
body = "SMA:connector_outer_2"
profiles = [["L1", "L2", "L3", "L4"], ["L5", "L6", "L7", "L8"]]

[[feature]]
name = "PadExt"
type = "extrude"
sketch = "TopCopper"
distance = "board.cu"
operation = "new"
body = "Conn_Pads"
profiles = [["PadL"], ["PadR"]]

[[body]]
name = "Substrate"
color = "#2e7d32"

[[body]]
name = "Ground"
color = "#d4a017"

[[body]]
name = "Patch"
color = "#d4a017"

[[body]]
name = "Trace"
color = "#d4a017"

[[body]]
name = "Conn_Pads"
color = "#bd9a1d"

[[group]]
name = "SMA"
bodies = ["SMA:connector_outer", "SMA:connector_outer_2", "SMA:connector_dielectric", "SMA:connector_wire", "Port"]

[[transform]]
name = "PlaceSMA"
type = "move"
offset = ["sma.axis", "-board.y/2 + notch.depth + sma.reach", "fr4 + board.cu + sma.lift"]
axis = "Y Axis"
angle = "90"
targets = ["group:SMA"]

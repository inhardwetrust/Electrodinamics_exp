format = "mycad-part"
version = 1

[[parameter]]
name = "bx"
formula = "30"
comment = "the board's width (x)"

[[parameter]]
name = "edge"
formula = "-25"
comment = "the board's edge with the connector (y)"

[[parameter]]
name = "line_end"
formula = "-5"
comment = "where the line and the board end, the box port beyond (y)"

[[parameter]]
name = "h"
formula = "1.6"
comment = "the board's total thickness"

[[parameter]]
name = "t"
formula = "0.035"
comment = "copper (1 oz) on each side"

[[parameter]]
name = "hd"
formula = "h - 2 * t"
comment = "FR4 between the copper layers"

[[parameter]]
name = "w50"
formula = "2.93"
comment = "50 Ohm microstrip width (Hammerstad, eps_r 4.3, h 1.53, t 0.035)"

[[parameter]]
name = "pin_d"
formula = "0.9"
comment = "the connector's pin diameter where it lies on the board"

[[parameter]]
name = "launch"
formula = "4"
comment = "how far the pin and the legs reach over the board from its edge"

[[parameter]]
name = "pad_w"
formula = "w50"
comment = "the trace's width under the pin"

[[parameter]]
name = "pad_len"
formula = "launch"
comment = "the length of the trace at pad_w from the edge"

[[parameter]]
name = "taper"
formula = "1"
comment = "the taper from pad_w to w50"

[[parameter]]
name = "gap"
formula = "0.5"
comment = "the gap from the trace under the pin to the top ground pads"

[[parameter]]
name = "gnd_xo"
formula = "4.5"
comment = "the top ground pads' outer edge (x)"

[[parameter]]
name = "gnd_len"
formula = "launch + 1"
comment = "the top ground pads' length from the edge"

[[parameter]]
name = "via_d"
formula = "0.5"
comment = "the vias' diameter (filled, PEC)"

[[parameter]]
name = "via_x"
formula = "3.7"
comment = "the vias' x (both sides)"

[[parameter]]
name = "via_y1"
formula = "0.6"
comment = "the first via row from the edge"

[[parameter]]
name = "via_dy"
formula = "1.6"
comment = "the via pitch along y"

[[parameter]]
name = "solder_in"
formula = "0.3"
comment = "the pin's solder: set back from both ends of the pin over the board"

[[parameter]]
name = "solder_h"
formula = "pin_d / 2"
comment = "the pin's solder: from the trace's top up to the pin's axis"

[[parameter]]
name = "port_h"
formula = "8"
comment = "the line port box's height above the ground"

# --- the board: FR4 from z 0 up by hd, the ground under it
[[feature]]
name = "BoardSketch"
type = "sketch"
plane = "XY Plane"

[[feature.point]]
name = "P1"
x = "-bx/2"
y = "edge"

[[feature.point]]
name = "P2"
x = "bx/2"
y = "edge"

[[feature.point]]
name = "P3"
x = "bx/2"
y = "line_end"

[[feature.point]]
name = "P4"
x = "-bx/2"
y = "line_end"

[[feature.line]]
name = "L1"
start = "P1"
end = "P2"

[[feature.line]]
name = "L2"
start = "P2"
end = "P3"

[[feature.line]]
name = "L3"
start = "P3"
end = "P4"

[[feature.line]]
name = "L4"
start = "P4"
end = "P1"

[[feature]]
name = "SubstrateExt"
type = "extrude"
sketch = "BoardSketch"
profiles = [["L1", "L2", "L3", "L4"]]
distance = "hd"
operation = "new"
body = "Substrate"

[[feature]]
name = "GroundSketch"
type = "sketch"
plane = "SubstrateExt:start"

[[feature.point]]
name = "P1"
x = "-bx/2"
y = "-line_end"

[[feature.point]]
name = "P2"
x = "bx/2"
y = "-line_end"

[[feature.point]]
name = "P3"
x = "bx/2"
y = "-edge"

[[feature.point]]
name = "P4"
x = "-bx/2"
y = "-edge"

[[feature.line]]
name = "L1"
start = "P1"
end = "P2"

[[feature.line]]
name = "L2"
start = "P2"
end = "P3"

[[feature.line]]
name = "L3"
start = "P3"
end = "P4"

[[feature.line]]
name = "L4"
start = "P4"
end = "P1"

[[feature]]
name = "GroundExt"
type = "extrude"
sketch = "GroundSketch"
profiles = [["L1", "L2", "L3", "L4"]]
distance = "t"
operation = "new"
body = "Ground"

# --- top copper: the trace (pad_w under the pin, a taper, w50), the ground pads
[[feature]]
name = "TopSketch"
type = "sketch"
plane = "SubstrateExt:end"

[[feature.point]]
name = "F1"
x = "0"
y = "edge"

[[feature.point]]
name = "F2"
x = "0"
y = "edge + pad_len"

[[feature.point]]
name = "F3"
x = "0"
y = "edge + pad_len + taper"

[[feature.point]]
name = "F4"
x = "0"
y = "line_end"

[[feature.polyline]]
name = "Trace"
points = ["F1", "F2", "F3", "F4"]
widths = ["pad_w", "pad_w", "w50", "w50"]
width = "w50"
start = "flat"
end = "flat"

[[feature.point]]
name = "RP1"
x = "pad_w/2 + gap"
y = "edge"

[[feature.point]]
name = "RP2"
x = "gnd_xo"
y = "edge"

[[feature.point]]
name = "RP3"
x = "gnd_xo"
y = "edge + gnd_len"

[[feature.point]]
name = "RP4"
x = "pad_w/2 + gap"
y = "edge + gnd_len"

[[feature.line]]
name = "RL1"
start = "RP1"
end = "RP2"

[[feature.line]]
name = "RL2"
start = "RP2"
end = "RP3"

[[feature.line]]
name = "RL3"
start = "RP3"
end = "RP4"

[[feature.line]]
name = "RL4"
start = "RP4"
end = "RP1"

[[feature.point]]
name = "GP1"
x = "-gnd_xo"
y = "edge"

[[feature.point]]
name = "GP2"
x = "-pad_w/2 - gap"
y = "edge"

[[feature.point]]
name = "GP3"
x = "-pad_w/2 - gap"
y = "edge + gnd_len"

[[feature.point]]
name = "GP4"
x = "-gnd_xo"
y = "edge + gnd_len"

[[feature.line]]
name = "GL1"
start = "GP1"
end = "GP2"

[[feature.line]]
name = "GL2"
start = "GP2"
end = "GP3"

[[feature.line]]
name = "GL3"
start = "GP3"
end = "GP4"

[[feature.line]]
name = "GL4"
start = "GP4"
end = "GP1"

[[feature]]
name = "TraceExt"
type = "extrude"
sketch = "TopSketch"
profiles = [["Trace"]]
distance = "t"
operation = "new"
body = "Trace"

[[feature]]
name = "TopGndExt"
type = "extrude"
sketch = "TopSketch"
profiles = [["RL1", "RL2", "RL3", "RL4"], ["GL1", "GL2", "GL3", "GL4"]]
distance = "t"
operation = "new"
body = "TopGround"

# --- vias: filled cylinders through the FR4 under the ground pads
[[feature]]
name = "ViaSketch"
type = "sketch"
plane = "XY Plane"

[[feature.point]]
name = "V1"
x = "via_x"
y = "edge + via_y1 + 0 * via_dy"

[[feature.circle]]
name = "C1"
center = "V1"
radius = "via_d/2"

[[feature.point]]
name = "V2"
x = "via_x"
y = "edge + via_y1 + 1 * via_dy"

[[feature.circle]]
name = "C2"
center = "V2"
radius = "via_d/2"

[[feature.point]]
name = "V3"
x = "via_x"
y = "edge + via_y1 + 2 * via_dy"

[[feature.circle]]
name = "C3"
center = "V3"
radius = "via_d/2"

[[feature.point]]
name = "V4"
x = "-via_x"
y = "edge + via_y1 + 0 * via_dy"

[[feature.circle]]
name = "C4"
center = "V4"
radius = "via_d/2"

[[feature.point]]
name = "V5"
x = "-via_x"
y = "edge + via_y1 + 1 * via_dy"

[[feature.circle]]
name = "C5"
center = "V5"
radius = "via_d/2"

[[feature.point]]
name = "V6"
x = "-via_x"
y = "edge + via_y1 + 2 * via_dy"

[[feature.circle]]
name = "C6"
center = "V6"
radius = "via_d/2"

[[feature]]
name = "ViaExt"
type = "extrude"
sketch = "ViaSketch"
profiles = [["C1"], ["C2"], ["C3"], ["C4"], ["C5"], ["C6"]]
distance = "hd"
operation = "new"
body = "Vias"

# --- the SMA end launch, as received
[[feature]]
name = "SMA"
type = "import"
file = "launch.files/realconnector.stp"
sha256 = "b3ca3a28cd2ffd839aac35b41e640c4d4876db66c2ab465d82391ee13584e0fd"
bodies = ["SMA:connector_outer", "SMA:connector_outer_2", "SMA:connector_dielectric", "SMA:connector_wire", "SMA:Volumenkörper16"]

# --- solder under the round pin: trace top up to the pin's axis
[[feature]]
name = "PinSolderSketch"
type = "sketch"
plane = "TraceExt:end"

[[feature.point]]
name = "P1"
x = "-pin_d/2"
y = "edge + solder_in"

[[feature.point]]
name = "P2"
x = "pin_d/2"
y = "edge + solder_in"

[[feature.point]]
name = "P3"
x = "pin_d/2"
y = "edge + launch - solder_in"

[[feature.point]]
name = "P4"
x = "-pin_d/2"
y = "edge + launch - solder_in"

[[feature.line]]
name = "L1"
start = "P1"
end = "P2"

[[feature.line]]
name = "L2"
start = "P2"
end = "P3"

[[feature.line]]
name = "L3"
start = "P3"
end = "P4"

[[feature.line]]
name = "L4"
start = "P4"
end = "P1"

[[feature]]
name = "PinSolderExt"
type = "extrude"
sketch = "PinSolderSketch"
profiles = [["L1", "L2", "L3", "L4"]]
distance = "solder_h"
operation = "new"
body = "PinSolder"

# --- the line's port: a box beyond the board's end, ground bottom to port_h
[[feature]]
name = "PortPlane"
type = "workplane"
base = "XZ Plane"
offset = "line_end"
visible = false

[[feature]]
name = "PortSketch"
type = "sketch"
plane = "PortPlane"

[[feature.point]]
name = "P1"
x = "-bx/2"
y = "t"

[[feature.point]]
name = "P2"
x = "bx/2"
y = "t"

[[feature.point]]
name = "P3"
x = "bx/2"
y = "-port_h"

[[feature.point]]
name = "P4"
x = "-bx/2"
y = "-port_h"

[[feature.line]]
name = "L1"
start = "P1"
end = "P2"

[[feature.line]]
name = "L2"
start = "P2"
end = "P3"

[[feature.line]]
name = "L3"
start = "P3"
end = "P4"

[[feature.line]]
name = "L4"
start = "P4"
end = "P1"

[[feature]]
name = "PortExt"
type = "extrude"
sketch = "PortSketch"
profiles = [["L1", "L2", "L3", "L4"]]
distance = "1"
operation = "new"
body = "LinePort"

[[body]]
name = "Substrate"
color = "#2e7d32"

[[body]]
name = "Ground"
color = "#d4a017"

[[body]]
name = "Trace"
color = "#d4a017"

[[body]]
name = "TopGround"
color = "#d4a017"

[[body]]
name = "Vias"
color = "#c0c0c0"

[[body]]
name = "PinSolder"
color = "#b0b0b0"

[[body]]
name = "LinePort"
color = "#6a5acd"

[[group]]
name = "SMA"
bodies = ["SMA:connector_outer", "SMA:connector_outer_2", "SMA:connector_dielectric", "SMA:connector_wire", "SMA:Volumenkörper16"]

# turned 90 deg around Y (one leg pair into the ground, the other beside the pin),
# then moved: flush with the edge, the pin on the trace
[[transform]]
name = "PlaceSMA"
type = "move"
targets = ["group:SMA"]
axis = "Y Axis"
angle = "90"
offset = ["0.5", "edge + launch", "hd + t + pin_d/2"]

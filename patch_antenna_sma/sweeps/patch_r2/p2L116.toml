# customcst project for p2L116.step

[simulation]
f_min = 4.5   # GHz
f_max = 7.0   # GHz
padding = 15.0   # mm
trim_pulse = false
accuracy = "-50"   # dB
excite = "SMA:Volumenkörper16"

[mesh]
cells_per_wavelength = 20.0
cells_per_feature = 8.0
max_ratio = 1.3
min_step = 0.025   # mm
slanted = true

[farfield]
frequencies = "5.75"   # GHz

[bodies.Ground]
type = "pec"

[bodies.Patch]
type = "pec"

[bodies.PinSolder]
type = "pec"

[bodies."SMA:Volumenkörper16"]
type = "waveport"

[bodies."SMA:connector_dielectric"]
type = "dielectric"
material = "Custom"
eps_r = 2.1
tan_d = 0.0002
f_ref = 5.75   # GHz
mu_r = 1.0

[bodies."SMA:connector_outer"]
type = "pec"

[bodies."SMA:connector_outer_2"]
type = "pec"

[bodies."SMA:connector_wire"]
type = "pec"

[bodies.Substrate]
type = "dielectric"
material = "Custom"
eps_r = 4.3
tan_d = 0.02
f_ref = 5.75   # GHz
mu_r = 1.0

[bodies.TopGround]
type = "pec"

[bodies.Trace]
type = "pec"

[bodies.Vias]
type = "pec"

[view]
up = "z"
edges = true
xray = false
ref_planes = true
mesh = false
materials = false
section = false
flip = false
plane = "z"
at = 2.015   # mm
hidden = []
camera_center = [0.3711, -24.1956, -0.6125]   # mm
camera_distance = 55.5696   # mm
camera_rotation = [0.056593, -0.748492, 0.660724, 0.134955, -0.649976, -0.747876, 0.989234, 0.131493, 0.064229]

[z0path]
axis = "z"
at = 1.53   # mm
half_width = 2.0   # mm
points = []   # mm

[materials.Default]
eps_r = 1.0
tan_d = 0.0
f_ref = 10.0   # GHz
mu_r = 1.0

[materials.FR4]
eps_r = 4.3
tan_d = 0.02
f_ref = 3.0   # GHz
mu_r = 1.0

[materials.PTFE]
eps_r = 2.1
tan_d = 0.0002
f_ref = 10.0   # GHz
mu_r = 1.0
